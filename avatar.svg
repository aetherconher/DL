<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbd38d"/>
      <stop offset="100%" stop-color="#f6ad55"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(6, 182, 212, 0.4)"/>
      <stop offset="100%" stop-color="rgba(99, 102, 241, 0.2)"/>
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="250" cy="250" r="230" fill="url(#bgGlow)"/>

  <!-- Orbital Rings / Tech HUD elements -->
  <circle cx="250" cy="250" r="225" fill="none" stroke="url(#orbGrad)" stroke-width="2" stroke-dasharray="12 8" opacity="0.6"/>
  <circle cx="250" cy="250" r="215" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
  <circle cx="250" cy="250" r="195" fill="#0f172a" stroke="rgba(255, 255, 255, 0.1)" stroke-width="2"/>

  <!-- Glowing Nodes on Ring -->
  <circle cx="75" cy="180" r="5" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="425" cy="180" r="5" fill="#8b5cf6" filter="url(#glow)"/>
  <circle cx="390" cy="360" r="6" fill="#3b82f6" filter="url(#glow)"/>
  <circle cx="110" cy="360" r="4" fill="#06b6d4" filter="url(#glow)"/>

  <!-- Character Artwork -->
  <g transform="translate(0, 20)">
    <!-- Base Body & Jacket -->
    <!-- Shoulders / Jacket -->
    <path d="M 140 430 C 140 350, 190 320, 250 320 C 310 320, 360 350, 360 430 Z" fill="url(#jacketGrad)" stroke="rgba(99, 102, 241, 0.3)" stroke-width="2"/>

    <!-- Inner Hoodie V-Shape -->
    <path d="M 210 320 L 250 395 L 290 320 Z" fill="#090d16"/>
    <path d="M 220 320 L 250 380 L 280 320 Z" fill="url(#hoodieGrad)" opacity="0.85"/>

    <!-- T-Shirt Collar / Tech Pattern -->
    <path d="M 230 320 L 250 355 L 270 320 Z" fill="#ffffff" opacity="0.9"/>
    
    <!-- Neck -->
    <rect x="225" y="250" width="50" height="65" rx="6" fill="url(#skinGrad)"/>
    <!-- Shadow under chin -->
    <path d="M 225 250 C 235 270, 265 270, 275 250 Z" fill="#e28743" opacity="0.4"/>

    <!-- Face Shape -->
    <path d="M 190 190 C 190 270, 210 290, 250 290 C 290 290, 310 270, 310 190 C 310 130, 290 130, 250 130 C 210 130, 190 130, 190 190 Z" fill="url(#skinGrad)"/>

    <!-- Ears -->
    <ellipse cx="188" cy="205" rx="9" ry="16" fill="#f6ad55"/>
    <ellipse cx="312" cy="205" rx="9" ry="16" fill="#f6ad55"/>

    <!-- Hair (Modern sleek pompadour/fade style) -->
    <path d="M 185 180 C 180 130, 210 110, 250 108 C 295 106, 320 125, 315 175 C 305 155, 290 150, 280 150 C 265 140, 230 142, 210 155 C 195 160, 190 170, 185 180 Z" fill="url(#hairGrad)"/>
    <path d="M 210 120 C 250 105, 290 115, 305 135 C 275 125, 240 125, 210 120 Z" fill="#334155" opacity="0.5"/>

    <!-- Eyebrows -->
    <path d="M 210 178 Q 225 173 238 178" stroke="#1e293b" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M 262 178 Q 275 173 290 178" stroke="#1e293b" stroke-width="4.5" stroke-linecap="round" fill="none"/>

    <!-- Eyes -->
    <circle cx="225" cy="192" r="5.5" fill="#0f172a"/>
    <circle cx="275" cy="192" r="5.5" fill="#0f172a"/>
    <!-- Catchlights in eyes -->
    <circle cx="227" cy="190" r="2" fill="#ffffff"/>
    <circle cx="277" cy="190" r="2" fill="#ffffff"/>

    <!-- Modern Smart Glasses Frame -->
    <rect x="204" y="180" width="38" height="24" rx="7" fill="url(#glassGrad)" stroke="#06b6d4" stroke-width="2.5"/>
    <rect x="258" y="180" width="38" height="24" rx="7" fill="url(#glassGrad)" stroke="#06b6d4" stroke-width="2.5"/>
    <!-- Bridge -->
    <line x1="242" y1="189" x2="258" y2="189" stroke="#06b6d4" stroke-width="2.5"/>
    <!-- Glasses shine reflection -->
    <line x1="210" y1="185" x2="225" y2="198" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="264" y1="185" x2="279" y2="198" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- Nose -->
    <path d="M 247 202 Q 250 216 253 216" stroke="#dd6b20" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Warm Friendly Smile -->
    <path d="M 234 235 Q 250 248 266 235" stroke="#9c4221" stroke-width="3.5" stroke-linecap="round" fill="none"/>

    <!-- Futuristic Over-Ear Headset (Tech Vibe) -->
    <path d="M 183 175 C 175 175 170 195 170 215 C 170 230 176 240 184 240 Z" fill="#6366f1" filter="url(#glow)"/>
    <path d="M 317 175 C 325 175 330 195 330 215 C 330 230 324 240 316 240 Z" fill="#6366f1" filter="url(#glow)"/>
    <path d="M 180 180 C 180 120 320 120 320 180" stroke="#4f46e5" stroke-width="6" fill="none" opacity="0.75"/>
    <circle cx="178" cy="208" r="4" fill="#22d3ee"/>
    <circle cx="322" cy="208" r="4" fill="#22d3ee"/>
  </g>

  <!-- Futuristic Floating Binary/Code particles -->
  <text x="65" y="130" font-family="monospace" font-size="12" fill="#06b6d4" opacity="0.75">&lt;dev&gt;</text>
  <text x="390" y="270" font-family="monospace" font-size="12" fill="#8b5cf6" opacity="0.75">&#123;code&#125;</text>
  <text x="70" y="290" font-family="monospace" font-size="11" fill="#6366f1" opacity="0.65">010101</text>
  <text x="375" y="135" font-family="monospace" font-size="12" fill="#10b981" opacity="0.75">JECRC 24</text>
</svg>
